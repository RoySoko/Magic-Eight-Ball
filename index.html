<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Amanda Sokolowski">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Eight Ball</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="eight-ball">
    <div class="ball-face">
      <p id="answer"></p>
    </div>
  </div>

  <script>
    // 8 responses
    var responses = [
      "Definitely yes.",
      "Most likely.",
      "Ask again later.",
      "Cannot predict now.",
      "Don't count on it.",
      "Very doubtful.",
      "Signs point to yes.",
      "Outlook not so good."
    ];
    var again = true;
    while (again) {
      var question = prompt("Ask a yes-or-no question:");
      if (question === null) { break; }

      var idx = Math.floor(Math.random() * responses.length);
      var reply = responses[idx];

      
      document.getElementById("answer").textContent = reply;

      
      again = confirm("Shake again?");
    }
  </script>
</body>
</html>
